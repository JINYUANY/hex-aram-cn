name: Sync CN game data
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-data.yml'
      - 'hex-aram-cn-source.zip'
permissions:
  contents: write
concurrency:
  group: cn-game-data-main
  cancel-in-progress: false
jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read published project adapters
        run: unzip -q hex-aram-cn-source.zip -d "$RUNNER_TEMP/atlas"
      - name: Check Tencent and the configured providers
        id: sync
        continue-on-error: true
        env:
          HERO_POOL_URL: ${{ vars.HERO_POOL_URL }}
          ARAMGG_API_KEY: ${{ secrets.ARAMGG_API_KEY }}
        run: node "$RUNNER_TEMP/atlas/hex-aram-cn/scripts/sync-public-data.mjs" "$GITHUB_WORKSPACE/live-data.json"
      - name: Publish verified changes
        run: |
          test -f live-data.json
          git add -- live-data.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Sync CN game data'
            git push origin HEAD:main
          fi
      - name: Report incomplete upstream checks
        if: steps.sync.outcome == 'failure'
        run: exit 1
